name: CD (Azure, manual)

# The dashboard is hosted on Streamlit Community Cloud, which redeploys on
# every push to main. This workflow is kept as a manual alternative that
# deploys the same app to Azure App Service.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Assemble the deployment package
        run: |
          mkdir deploy
          cp -r app/. deploy/
          cp -r .streamlit deploy/
          pip install -r app/requirements.txt --target deploy/.python_packages

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: credit-risk-pd-ecl
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy